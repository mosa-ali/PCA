# PCA Public — Release A production server configuration.
#
# Serves the prerendered bilingual artifact in public-web/dist with the real
# HTTP response headers that a <meta> tag cannot deliver. Everything here is
# verified against a running container by deploy/verify-container.mjs; the
# required header values come from public-web/src/lib/seo.mjs, so the policy the
# build asserts and the policy the server sends are one document.
#
# NOT DEPLOYED. Release A publication is not authorised.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Do not advertise the nginx version to every visitor and scanner.
    server_tokens off;

    # The artifact is topology-neutral: no origin is baked into any link, so the
    # server must not bake one into a redirect either. Without these, nginx
    # answers /privacy with an absolute Location built from its own hostname and
    # port -- which behind App Service is the container's internal address, not
    # www.pcasafe.com. Relative redirects keep the artifact portable.
    absolute_redirect off;
    port_in_redirect off;

    # ---------------------------------------------------------------------
    # Security headers
    #
    # `always` matters: without it nginx omits these on 4xx/5xx responses, so
    # the 404 page -- a real, indexable-by-accident HTML page with links -- would
    # ship with no CSP and no clickjacking protection at all.
    #
    # CAUTION for future edits: an `add_header` anywhere in a `location` block
    # DISCARDS every add_header inherited from this level. That is why no
    # location below sets one, and why cache policy is expressed with `expires`
    # (which does not reset inheritance) instead. If you ever need a header in a
    # location, you must repeat all of these there too.
    # ---------------------------------------------------------------------

    # Derived from what the artifact actually loads: one same-origin stylesheet,
    # one same-origin script, same-origin SVG images. Everything else inherits
    # default-src 'none'. No 'unsafe-inline', no 'unsafe-eval', no wildcard.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Evaluated against actual behaviour, not copied in: this site opens no
    # popup, is opened by none, and is meant to be embedded by nobody.
    # Cross-Origin-Embedder-Policy is deliberately absent -- it buys cross-origin
    # isolation, which only matters for SharedArrayBuffer and high-resolution
    # timers, and neither is used.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/xml
        image/svg+xml;
    # gzip_types never includes text/html: nginx always compresses it when gzip
    # is on, and listing it logs a duplicate-MIME warning on every start.

    # ---------------------------------------------------------------------
    # Health
    #
    # Plain text, no logging, no dependency on the artifact -- so a health probe
    # answers even if the content mount is wrong, and the answer distinguishes
    # "container up" from "site correct". Those are different questions and the
    # predeploy report keeps them apart.
    # ---------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # Caching
    #
    # Asset filenames are NOT content-hashed (assets/pca-public.css, not
    # pca-public.<hash>.css), so a long immutable cache would strand visitors on
    # a stale stylesheet after a deploy. One hour is the honest ceiling until
    # hashed filenames exist. HTML is always revalidated so a copy correction
    # reaches readers immediately -- which matters when the copy carries privacy
    # claims.
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location = /favicon.svg { expires 1h; }
    location = /robots.txt  { expires 1h; }
    location = /sitemap.xml { expires 1h; }

    # ---------------------------------------------------------------------
    # Routing
    #
    # Real directories with real index.html files. There is deliberately NO SPA
    # history fallback: a missing path must 404, not silently render the home
    # page under the wrong URL. Both existing PCA consoles do the latter, and it
    # is how a broken link becomes a soft-200 that no crawler reports.
    # ---------------------------------------------------------------------
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # Nothing here starts with a dot, so any request for one is probing.
    location ~ /\. {
        deny all;
    }
}
