# PCA Platform Admin Web — nginx configuration.
#
# Serves the built SPA. This is the Platform Admin surface only; it is NOT the
# Public site's configuration and must never be used for it. Public Release A
# has its own tested authority at public-web/deploy/nginx.conf with a stricter
# policy, derived from an artifact that loads nothing this one does.
#
# Runs unprivileged on 8080: a non-root process cannot bind port 80, and the
# earlier version of this file paired `listen 80` with a non-root USER, which
# could never have started.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    autoindex off;

    absolute_redirect off;
    port_in_redirect off;

    # ---------------------------------------------------------------------
    # Security headers
    #
    # `always`, so they are present on 4xx/5xx too and not just on 200s.
    #
    # CAUTION, and the reason this file is shaped the way it is: an `add_header`
    # anywhere inside a `location` block DISCARDS every add_header inherited
    # from this level. The previous version of this file set
    # `add_header Cache-Control ...` inside both the static-asset location and
    # the SPA-fallback location -- which silently stripped X-Frame-Options,
    # X-Content-Type-Options, X-XSS-Protection and Referrer-Policy from every
    # asset and every page it served. That is every response the console
    # actually returns. No location below sets an add_header; cache policy uses
    # `expires`, which does not reset inheritance.
    # ---------------------------------------------------------------------

    # This CSP is derived from what the Platform Admin bundle needs, NOT copied
    # from the Public site. Vite emits a hashed JS/CSS bundle and React inserts
    # styles at runtime, so 'unsafe-inline' is required for style-src here --
    # a real constraint of this app, not a convenience. connect-src is 'self'
    # because the console calls the backend same-origin (apiBaseUrl defaults to
    # ''). If the console is ever served from a different origin than the API,
    # this directive is what must change, deliberately.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # X-XSS-Protection is deliberately absent. It is deprecated, ignored by
    # every current browser, and its legacy filter introduced vulnerabilities of
    # its own. The CSP above is what actually provides this protection.
    #
    # Strict-Transport-Security is deliberately absent HERE. It belongs on the
    # TLS terminator, which for this surface is Azure App Service, not on a
    # container that only ever sees plain HTTP behind a proxy. Setting it here
    # would be inert at best and, if this image were ever served over plain HTTP
    # on a shared host, actively wrong.

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets/, so these are safe to
    # cache immutably -- a new build produces new filenames.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Platform Admin API reverse proxy.
    #
    # WHY THIS EXISTS: this console is built with `apiBaseUrl = ''`
    # (src/config/env.ts), so every API call it makes is SAME-ORIGIN, and the
    # CSP above says `connect-src 'self'` for exactly that reason. A same-origin
    # console therefore REQUIRES a reverse proxy serving its API paths from this
    # same origin. That proxy was missing: the console shipped with a bare SPA
    # server, so `GET /platform-admin/auth/whoami` (and every other API call)
    # matched `location /` below, took the history fallback, and came back as
    # `index.html` with HTTP 200. A JSON client receiving HTML cannot detect
    # that as an error -- `platformAdminAuthClient.whoami()` calls
    # `response.json()`, which throws on the HTML body, and the console reports
    # the failure as a session problem rather than a routing one. The live
    # symptom was exactly that: `platform.pcasafe.com` answered
    # `/platform-admin/auth/whoami` with the SPA shell while
    # `api.pcasafe.com` answered the same path with `401 application/json`.
    #
    # WHY THE PREFIX CANNOT COLLIDE WITH A CONSOLE ROUTE: every client-side
    # route in this app is declared WITHOUT the `/platform-admin` prefix --
    # `login`, `activate`, `dashboard`, `accounts`, `entitlements`, `billing/*`,
    # `settlement/*`, `admin-users`, `audit`, `settings` (see src/App.tsx and
    # src/nav/navConfig.ts) -- while every backend route this console calls IS
    # under `/platform-admin/` (auth, activation, admin-users, ...). nginx picks
    # the LONGEST matching prefix, so this block wins for API paths wherever it
    # sits in the file, and `/activate` still reaches the SPA. The trailing
    # slash is deliberate: it stops a hypothetical future page at
    # `/platform-administration` from being proxied.
    #
    # WHY THE UPSTREAM IS LITERAL AND NOT AN ENVIRONMENT VARIABLE: a reverse
    # proxy has to know where to forward. Templating it would mean shipping the
    # config as an `${VAR}` template plus a required App Service variable, and
    # an unset variable would then produce an empty `proxy_pass` and a container
    # that fails to start -- a worse failure than the one this fixes. The
    # hostname is also already a fixed deployment fact recorded in this
    # repository (docker-compose.yml's topology comment, public-web's platform
    # handoff, and the Android/iOS clients' recorded production API host).
    #
    # proxy_ssl_server_name is NOT optional and is NOT nginx's default: App
    # Service terminates TLS with SNI-based routing, so without it the upstream
    # handshake carries no target hostname and the proxy fails instead of
    # reaching the backend. `Host` is set explicitly for the same class of
    # reason -- App Service routes on the inbound Host header, and nginx would
    # otherwise forward this console's own hostname.
    #
    # X-Forwarded-For is OVERWRITTEN with `$remote_addr`, deliberately NOT
    # `$proxy_add_x_forwarded_for`. The backend's trustProxy defaults to `false`
    # and is only ever enabled from the CIDR allowlist in
    # `PCA_TRUSTED_PROXY_CIDRS` (src/http/trustProxyConfig.ts). Appending rather
    # than overwriting would preserve a client-supplied value in the chain, so
    # the day trustProxy is switched on, a spoofed header would become
    # `request.ip` -- the exact GHSA-3m5p-2c4r-xxw2 hop-count defect that module
    # exists to prevent. Overwriting keeps the value honest whether or not it is
    # trusted. X-Forwarded-Proto is deliberately absent: nothing in the backend
    # reads it, and at this hop the honest value would be `http`.
    #
    # CAVEAT, recorded rather than hidden: because trustProxy is false, with
    # this hop in place `request.ip` is this nginx's egress address for every
    # console API call, so the platform-admin surface's per-IP rate-limit
    # budgets (platform-admin-auth-attempt 30/min, platform-admin-activation
    # 10/min) become per-console rather than per-caller. For a single-operator
    # console that is immaterial, and administrator lockout/alerting is keyed by
    # email hash rather than by IP, so brute-force protection is unaffected.
    # Sharing budgets would only become a real concern if this surface ever
    # serves more than one concurrent operator.
    # ---------------------------------------------------------------------
    location /platform-admin/ {
        proxy_pass https://api.pcasafe.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api.pcasafe.com;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Bounded, because the API is a JSON service with no streaming or
        # long-poll endpoints. A stuck upstream must not pin a worker.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # No `try_files` and no `error_page` here, and no `add_header` either:
        # an unreachable upstream must produce a truthful 502 rather than the
        # SPA shell (which is how this defect presented in the first place), and
        # an `add_header` inside a location discards every inherited security
        # header -- see the CAUTION at the top of this file.
    }

    # SPA history fallback. Correct HERE and wrong for the Public site: this app
    # is a client-routed console whose routes exist only in the browser, whereas
    # the Public site is prerendered and a missing path there must 404 rather
    # than soft-200. The consequence is accepted deliberately: an unknown path
    # under this host returns the shell with HTTP 200. The console is noindex by
    # nature (authenticated, not linked publicly), so there is no crawler cost.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    # Source maps must not be served. Vite does not emit them by default for a
    # production build, and this makes that a property of the server rather than
    # a property of the current config.
    location ~ \.map$ {
        deny all;
    }
}
