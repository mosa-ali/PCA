name: Mobile device UAT

on:
  workflow_call:
    inputs:
      run_ios_simulator:
        description: Run the richer iOS simulator evidence job
        required: true
        type: boolean
      run_android_emulator:
        description: Run the Android emulator instrumentation job
        required: true
        type: boolean
      run_android_physical:
        description: Run the owner-controlled Windows physical Android job
        required: true
        type: boolean

# DEVICE ACCEPTANCE only. This workflow is deliberately not part of ordinary
# pull-request/push source acceptance and receives no production credentials.
permissions:
  contents: read

concurrency:
  group: mobile-device-uat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-simulator:
    name: iOS simulator evidence
    if: ${{ inputs.run_ios_simulator == true }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pca-dev
          persist-credentials: false

      - name: Record canonical pca-dev test source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          printf 'PCA_DEV_TESTED_SHA=%s\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"
          printf 'PCA_DEV_TESTED_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"

      - name: Inspect Xcode project and PCA scheme
        working-directory: ios
        run: |
          xcodebuild -list -project PCA.xcodeproj
          xcodebuild -showBuildSettings -project PCA.xcodeproj -scheme PCA -sdk iphonesimulator

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          mkdir -p ios/artifacts/ios
          xcrun simctl list devices available | tee ios/artifacts/ios/simulator-devices.txt
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone simulator was found on this macOS runner." >&2
            exit 1
          fi
          printf 'Selected simulator id: %s\n' "$device_id" > ios/artifacts/ios/selected-simulator.txt
          echo "PCA_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          echo "PCA_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"

      - name: Build and test the real iOS app and extension targets
        working-directory: ios
        shell: bash
        run: |
          mkdir -p artifacts/ios
          set +e
          xcodebuild test \
            -project PCA.xcodeproj \
            -scheme PCA \
            -destination "$PCA_SIMULATOR_DESTINATION" \
            -resultBundlePath "$PWD/artifacts/ios/PCA-Test.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$PWD/artifacts/ios/xcodebuild.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Capture iOS simulator evidence
        if: always()
        working-directory: ios
        shell: bash
        run: |
          mkdir -p artifacts/ios/simulator-diagnostics
          xcrun simctl list devices available > artifacts/ios/simulator-diagnostics/devices.txt 2>&1 || true
          if [[ "${{ job.status }}" != "success" ]]; then
            xcrun simctl diagnose > artifacts/ios/simulator-diagnostics/simctl-diagnose.txt 2>&1 || true
          fi
          if [[ -d artifacts/ios/PCA-Test.xcresult ]]; then
            xcrun xcresulttool get test-results summary \
              --path artifacts/ios/PCA-Test.xcresult \
              --format json > artifacts/ios/test-summary.json 2>&1 || true
          fi

      - name: Upload iOS simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-uat-ios-simulator
          path: ios/artifacts/ios
          if-no-files-found: warn
          retention-days: 30

  android-emulator:
    name: Android emulator instrumentation
    if: ${{ inputs.run_android_emulator == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pca-dev
          persist-credentials: false

      - name: Record canonical pca-dev test source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          printf 'PCA_DEV_TESTED_SHA=%s\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"
          printf 'PCA_DEV_TESTED_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK and API 35 emulator
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          diagnostic_file="artifacts/android/android-sdk-toolchain.txt"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk; do
              if [[ -d "$candidate" ]]; then
                sdk_root="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$sdk_root" || ! -d "$sdk_root" ]]; then
            printf 'ANDROID_SDK_ROOT=%s\n' "${sdk_root:-<unset>}" | tee "$diagnostic_file"
            echo 'Android SDK root could not be located from ANDROID_SDK_ROOT, ANDROID_HOME, or known runner locations.' >&2
            exit 1
          fi

          export ANDROID_SDK_ROOT="$sdk_root"
          export ANDROID_HOME="$sdk_root"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"

          runner_temp="${RUNNER_TEMP:-/tmp}"
          android_user_home="$runner_temp/android-user-home"
          android_avd_home="$runner_temp/android-avd"
          mkdir -p "$android_user_home" "$android_avd_home" "$android_user_home/avd"
          export ANDROID_USER_HOME="$android_user_home"
          export ANDROID_EMULATOR_HOME="$android_user_home"
          export ANDROID_AVD_HOME="$android_avd_home"
          printf 'ANDROID_USER_HOME=%s\n' "$android_user_home" >> "$GITHUB_ENV"
          printf 'ANDROID_EMULATOR_HOME=%s\n' "$android_user_home" >> "$GITHUB_ENV"
          printf 'ANDROID_AVD_HOME=%s\n' "$android_avd_home" >> "$GITHUB_ENV"

          tool_dirs=()
          add_tool_dir() {
            if [[ -d "$1" ]]; then
              tool_dirs+=("$1")
              printf '%s\n' "$1" >> "$GITHUB_PATH"
              export PATH="$1:$PATH"
            fi
          }
          add_tool_dir "$sdk_root/cmdline-tools/latest/bin"
          for cmdline_dir in "$sdk_root"/cmdline-tools/*/bin; do
            add_tool_dir "$cmdline_dir"
          done
          add_tool_dir "$sdk_root/tools/bin"
          add_tool_dir "$sdk_root/platform-tools"
          add_tool_dir "$sdk_root/emulator"

          sdkmanager_path="$(command -v sdkmanager || true)"
          avdmanager_path="$(command -v avdmanager || true)"
          emulator_path=""
          adb_path="$(command -v adb || true)"
          {
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
            printf 'ANDROID_USER_HOME=%s\n' "$android_user_home"
            printf 'ANDROID_AVD_HOME=%s\n' "$android_avd_home"
            printf 'sdkmanager=%s\n' "${sdkmanager_path:-<missing>}"
            printf 'avdmanager=%s\n' "${avdmanager_path:-<missing>}"
            printf 'emulator=%s\n' "${emulator_path:-<missing>}"
            printf 'adb=%s\n' "${adb_path:-<missing>}"
            printf '\nversions:\n'
            [[ -n "$sdkmanager_path" ]] && "$sdkmanager_path" --version 2>&1 || true
            [[ -n "$emulator_path" ]] && "$emulator_path" -version 2>&1 | head -n 2 || true
            [[ -n "$adb_path" ]] && "$adb_path" version 2>&1 | head -n 2 || true
          } | tee "$diagnostic_file"

          missing_tools=()
          [[ -n "$sdkmanager_path" ]] || missing_tools+=(sdkmanager)
          [[ -n "$avdmanager_path" ]] || missing_tools+=(avdmanager)
          [[ -n "$adb_path" ]] || missing_tools+=(adb)
          if (( ${#missing_tools[@]} > 0 )); then
            printf 'Missing pre-install Android SDK tools: %s\n' "${missing_tools[*]}" >&2
            exit 1
          fi

          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          emulator_path="$sdk_root/emulator/emulator"
          if [[ ! -x "$emulator_path" ]]; then
            emulator_path="$(command -v emulator || true)"
          fi
          if [[ -z "$emulator_path" || ! -x "$emulator_path" ]]; then
            echo 'Android emulator package installation completed but emulator executable was not found.' >&2
            exit 1
          fi
          printf 'emulator_after_install=%s\n' "$emulator_path" >> "$diagnostic_file"

          timeout_path="$(command -v timeout || true)"
          if [[ -z "$timeout_path" ]]; then
            echo 'GNU timeout is required for bounded Android emulator startup.' >&2
            exit 1
          fi

          avd_data_path="$android_avd_home/pca-api-35.avd"
          avd_list_file="artifacts/android/avd-list.txt"
          avd_metadata_file="artifacts/android/avd-metadata-listing.txt"
          emulator_log="artifacts/android/emulator.log"
          : > "$avd_list_file"
          : > "$avd_metadata_file"
          : > "$emulator_log"
          set +e
          echo 'no' | "$timeout_path" 120s "$avdmanager_path" create avd \
            --name pca-api-35 \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_2' \
            --path "$avd_data_path" \
            --force
          avd_create_status="${PIPESTATUS[1]}"
          set -e
          if [[ "$avd_create_status" -eq 124 ]]; then
            echo 'AVD creation exceeded the 120-second limit.' >&2
            exit 1
          fi
          if [[ "$avd_create_status" -ne 0 ]]; then
            echo "avdmanager create avd failed with exit code $avd_create_status." >&2
            exit "$avd_create_status"
          fi

          {
            printf 'ANDROID_USER_HOME=%s\n' "$android_user_home"
            printf 'ANDROID_AVD_HOME=%s\n' "$android_avd_home"
            printf 'expected_avd_data=%s\n' "$avd_data_path"
            printf 'expected_user_metadata=%s\n' "$android_user_home/avd/pca-api-35.ini"
            printf 'files:\n'
            find "$android_user_home" "$android_avd_home" -maxdepth 3 -type f -printf '%p\n' 2>/dev/null | sort
          } > "$avd_metadata_file"

          metadata_path=""
          if [[ -f "$android_user_home/avd/pca-api-35.ini" ]]; then
            metadata_path="$android_user_home/avd/pca-api-35.ini"
          else
            metadata_path="$(find "$android_user_home" "$android_avd_home" -maxdepth 3 -type f -name 'pca-api-35.ini' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$metadata_path" || ! -d "$avd_data_path" ]]; then
            echo 'AVD pca-api-35 was created but its expected metadata or data path is missing.' >&2
            exit 1
          fi
          printf 'metadata_path=%s\n' "$metadata_path" >> "$avd_metadata_file"

          set +e
          "$timeout_path" 30s "$emulator_path" -list-avds > "$avd_list_file" 2>&1
          avd_list_status=$?
          set -e
          if [[ "$avd_list_status" -eq 124 ]]; then
            echo 'emulator -list-avds exceeded the 30-second limit.' >&2
            exit 1
          fi
          if [[ "$avd_list_status" -ne 0 ]]; then
            echo "emulator -list-avds failed with exit code $avd_list_status." >&2
            exit "$avd_list_status"
          fi
          avd_match_count="$(grep -Fx 'pca-api-35' "$avd_list_file" | wc -l | tr -d ' ' || true)"
          if [[ "$avd_match_count" != '1' ]]; then
            echo 'AVD pca-api-35 was created but is not discoverable by the Android emulator.' >&2
            exit 1
          fi

          record_kvm_state() {
            local suffix="$1"
            local present='NO'
            local readable='NO'
            local writable='NO'
            local mode='<absent>'
            local group='<absent>'
            if [[ -e /dev/kvm ]]; then
              present='YES'
              [[ -r /dev/kvm ]] && readable='YES'
              [[ -w /dev/kvm ]] && writable='YES'
              mode="$(stat -c '%a' /dev/kvm 2>/dev/null || printf '<unavailable>')"
              group="$(stat -c '%G' /dev/kvm 2>/dev/null || printf '<unavailable>')"
            fi
            printf 'KVM_PRESENT_%s=%s\n' "$suffix" "$present" | tee -a "$diagnostic_file"
            printf 'KVM_READABLE_%s=%s\n' "$suffix" "$readable" | tee -a "$diagnostic_file"
            printf 'KVM_WRITABLE_%s=%s\n' "$suffix" "$writable" | tee -a "$diagnostic_file"
            printf 'KVM_MODE_%s=%s\n' "$suffix" "$mode" | tee -a "$diagnostic_file"
            printf 'KVM_GROUP_%s=%s\n' "$suffix" "$group" | tee -a "$diagnostic_file"
          }

          record_kvm_state BEFORE

          kvm_rule='KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'
          if ! printf '%s\n' "$kvm_rule" | sudo -n tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null; then
            echo 'KVM infrastructure setup failed: could not install the udev rule.' >&2
            exit 1
          fi
          if ! sudo -n udevadm control --reload-rules; then
            echo 'KVM infrastructure setup failed: could not reload udev rules.' >&2
            exit 1
          fi
          if ! sudo -n udevadm trigger --name-match=kvm; then
            echo 'KVM infrastructure setup failed: could not trigger the kvm udev rule.' >&2
            exit 1
          fi

          record_kvm_state AFTER
          if [[ ! -e /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KVM infrastructure unavailable: /dev/kvm must exist and be readable and writable before emulator launch.' >&2
            exit 1
          fi
          kvm_mode="$(stat -c '%a' /dev/kvm 2>/dev/null || printf '<unavailable>')"
          kvm_group="$(stat -c '%G' /dev/kvm 2>/dev/null || printf '<unavailable>')"
          printf 'KVM_PRESENT=YES\nKVM_READABLE=YES\nKVM_WRITABLE=YES\nKVM_MODE=%s\nKVM_GROUP=%s\n' \
            "$kvm_mode" "$kvm_group" >> "$diagnostic_file"

          "$emulator_path" -avd pca-api-35 \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            > "$emulator_log" 2>&1 &
          emulator_pid=$!
          printf '%s\n' "$emulator_pid" > artifacts/android/emulator.pid
          sleep 3
          if ! kill -0 "$emulator_pid" 2>/dev/null; then
            echo 'Android emulator exited during the startup grace period.' >&2
            tail -n 120 "$emulator_log" >&2 || true
            exit 1
          fi

          fail_emulator_startup() {
            echo "$1" >&2
            tail -n 120 "$emulator_log" >&2 || true
            exit 1
          }

          adb_serial=''
          adb_deadline=$((SECONDS + 180))
          while (( SECONDS < adb_deadline )); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              fail_emulator_startup 'Android emulator exited before adb reported a device.'
            fi
            set +e
            adb_output="$("$timeout_path" 10s "$adb_path" devices 2>&1)"
            adb_status=$?
            set -e
            printf '%s\n' "$adb_output" | awk 'NR == 1 { print "List of devices attached"; next } NF >= 2 { print "<emulator>\t" $2 }' > artifacts/android/adb-devices-startup.txt
            if [[ "$adb_status" -eq 124 ]]; then
              sleep 5
              continue
            fi
            ready_count="$(printf '%s\n' "$adb_output" | awk 'NR > 1 && $2 == "device" { count++ } END { print count + 0 }')"
            if [[ "$adb_status" -eq 0 && "$ready_count" -eq 1 ]]; then
              adb_serial="$(printf '%s\n' "$adb_output" | awk 'NR > 1 && $2 == "device" { print $1; exit }')"
              break
            fi
            if [[ "$ready_count" -gt 1 ]]; then
              fail_emulator_startup 'Multiple emulator devices were reported during startup.'
            fi
            sleep 5
          done
          if [[ -z "$adb_serial" ]]; then
            fail_emulator_startup 'adb did not report exactly one ready emulator within 180 seconds.'
          fi

          booted='NO'
          boot_deadline=$((SECONDS + 240))
          while (( SECONDS < boot_deadline )); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              fail_emulator_startup 'Android emulator exited before sys.boot_completed reached 1.'
            fi
            set +e
            boot_value="$("$timeout_path" 10s "$adb_path" -s "$adb_serial" shell getprop sys.boot_completed 2>&1 | tr -d '\r')"
            boot_status=$?
            set -e
            printf 'serial=<emulator> status=%s value=%s\n' "$boot_status" "$boot_value" > artifacts/android/boot-status.txt
            if [[ "$boot_status" -eq 0 && "$boot_value" == '1' ]]; then
              booted='YES'
              break
            fi
            sleep 5
          done
          if [[ "$booted" != 'YES' ]]; then
            fail_emulator_startup 'Android emulator did not reach sys.boot_completed=1 within 240 seconds.'
          fi

          "$timeout_path" 30s "$adb_path" -s "$adb_serial" shell settings put global window_animation_scale 0
          "$timeout_path" 30s "$adb_path" -s "$adb_serial" shell settings put global transition_animation_scale 0
          "$timeout_path" 30s "$adb_path" -s "$adb_serial" shell settings put global animator_duration_scale 0
          set +e
          final_devices="$("$timeout_path" 10s "$adb_path" devices -l 2>&1)"
          final_devices_status=$?
          set -e
          if [[ "$final_devices_status" -eq 124 ]]; then
            echo 'Final adb device inspection exceeded the 10-second limit.' >&2
            exit 1
          fi
          printf '%s\n' "$final_devices" | awk 'NR == 1 { print "List of devices attached"; next } NF >= 2 { print "<emulator>\t" $2 }' > artifacts/android/adb-devices-final.txt

      - name: Build application and instrumentation APKs
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Run the existing instrumentation tests
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest 2>&1 | tee artifacts/android/instrumentation.log
          status="${PIPESTATUS[0]}"
          set -e
          adb logcat -d -v threadtime -t 2000 \
            | grep -Ei 'AndroidRuntime|FATAL EXCEPTION|org\.pca\.app|TestRunner|Instrumentation' \
            | sed -E 's/(password|secret|token|authorization|bearer|private[_ -]?key|api[_ -]?key)([=: ]+)[^ ]+/\1\2[REDACTED]/Ig' \
            > artifacts/android/logcat-bounded.txt || true
          exit "$status"

      - name: Collect Android emulator reports
        if: always()
        working-directory: android
        shell: bash
        run: |
          mkdir -p artifacts/android/reports
          cp -R app/build/reports artifacts/android/reports/ 2>/dev/null || true
          cp -R app/build/outputs/androidTest-results artifacts/android/reports/ 2>/dev/null || true
          cp -R app/build/outputs/connected_android_test_additional_output artifacts/android/reports/ 2>/dev/null || true
          if [[ -f artifacts/android/emulator.pid ]]; then
            kill "$(cat artifacts/android/emulator.pid)" 2>/dev/null || true
          fi

      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-uat-android-emulator
          path: android/artifacts/android
          if-no-files-found: warn
          retention-days: 30

  physical-ref-guard:
    name: Physical Android ref guard
    if: ${{ inputs.run_android_physical == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require canonical pca-dev ref before using self-hosted infrastructure
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/pca-dev' ]]; then
            echo "Physical Android execution is permitted only from refs/heads/pca-dev; got $GITHUB_REF" >&2
            exit 1
          fi

  android-physical:
    name: Physical Android device acceptance
    needs: physical-ref-guard
    if: ${{ inputs.run_android_physical == true && needs.physical-ref-guard.result == 'success' }}
    runs-on: [self-hosted, Windows, X64, pca-android-device]
    timeout-minutes: 40
    steps:
      - name: Check out the canonical pca-dev source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pca-dev
          persist-credentials: false

      - name: Recheck canonical ref and record test source
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/pca-dev') {
            throw "Physical Android execution is permitted only from refs/heads/pca-dev; got $env:GITHUB_REF"
          }
          $sourceSha = (git rev-parse HEAD).Trim()
          "PCA_DEV_TESTED_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "PCA_DEV_TESTED_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify exactly one authorized Android device
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\android | Out-Null
          $rawLines = @(adb devices)
          $deviceLines = @($rawLines | Select-Object -Skip 1 | Where-Object { $_ -match '\S' })
          $sanitized = @('List of devices attached')
          foreach ($line in $deviceLines) {
            $sanitized += ($line -replace '^\S+', '<serial>')
          }
          $sanitized | Set-Content -Encoding utf8 artifacts\android\adb-devices.txt
          $sanitized | ForEach-Object { Write-Host $_ }
          if ($deviceLines.Count -eq 0) {
            throw 'No Android device is connected; refusing physical-device execution.'
          }
          if ($deviceLines.Count -ne 1) {
            throw 'Exactly one Android device is required; multiple or ambiguous devices are connected.'
          }
          if ($deviceLines[0] -notmatch '^\S+\s+device(?:\s|$)') {
            throw "The connected Android device is not authorized and ready (expected state=device): $($sanitized[1])"
          }
          $serial = ($deviceLines[0] -split '\s+')[0]
          "ANDROID_DEVICE_SERIAL=$serial" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application and instrumentation APKs
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Install the debug application on the authorized device
        working-directory: android
        shell: pwsh
        run: adb -s $env:ANDROID_DEVICE_SERIAL install -r app\build\outputs\apk\debug\app-debug.apk

      - name: Install the instrumentation test APK on the authorized device
        working-directory: android
        shell: pwsh
        run: |
          $testApk = 'app\build\outputs\apk\androidTest\debug\app-debug-androidTest.apk'
          if (-not (Test-Path $testApk)) {
            throw "Expected instrumentation APK was not produced: $testApk"
          }
          adb -s $env:ANDROID_DEVICE_SERIAL install -r $testApk

      - name: Run the existing instrumentation tests
        working-directory: android
        shell: pwsh
        run: |
          $status = 0
          & .\gradlew.bat --no-daemon --stacktrace connectedDebugAndroidTest 2>&1 | Tee-Object artifacts\android\instrumentation.log
          $status = $LASTEXITCODE
          adb -s $env:ANDROID_DEVICE_SERIAL logcat -d -v threadtime -t 2000 |
            Select-String -Pattern 'AndroidRuntime|FATAL EXCEPTION|org\.pca\.app|TestRunner|Instrumentation' |
            ForEach-Object { $_.Line -replace '(password|secret|token|authorization|bearer|private[_ -]?key|api[_ -]?key)([=: ]+)[^ ]+', '$1$2[REDACTED]' } |
            Set-Content -Encoding utf8 artifacts\android\logcat-bounded.txt
          exit $status

      - name: Collect physical Android reports
        if: always()
        working-directory: android
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\android\reports | Out-Null
          if (Test-Path app\build\reports) { Copy-Item -Recurse -Force app\build\reports artifacts\android\reports\ }
          if (Test-Path app\build\outputs\androidTest-results) { Copy-Item -Recurse -Force app\build\outputs\androidTest-results artifacts\android\reports\ }
          if (Test-Path app\build\outputs\connected_android_test_additional_output) { Copy-Item -Recurse -Force app\build\outputs\connected_android_test_additional_output artifacts\android\reports\ }

      - name: Upload physical Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-uat-android-physical
          path: android/artifacts/android
          if-no-files-found: warn
          retention-days: 30
