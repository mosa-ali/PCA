name: Mobile device UAT

on:
  workflow_dispatch:
    inputs:
      run_ios_simulator:
        description: Run the richer iOS simulator evidence job
        required: false
        default: true
        type: boolean
      run_android_emulator:
        description: Run the Android emulator instrumentation job
        required: false
        default: true
        type: boolean
      run_android_physical:
        description: Run the owner-controlled Windows physical Android job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dispatch:
    name: Run canonical pca-dev mobile UAT
    uses: ./.github/workflows/mobile-device-uat-core.yml
    with:
      run_ios_simulator: ${{ inputs.run_ios_simulator }}
      run_android_emulator: ${{ inputs.run_android_emulator }}
      run_android_physical: ${{ inputs.run_android_physical }}
