name: Quality gates

on:
  pull_request:
  push:
    branches:
      - pca-dev

# CI only reads the repository. It does not receive credentials, publish artifacts,
# deploy, or modify repository state.
permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    # This repository ships FOUR contract catalogues, each with its own validator and
    # its own catalogue test: the top-level protocol catalogue plus child-profile-scope,
    # runtime-sync and wellbeing-control. Until now this job ran only the top-level pair,
    # so three validators and three test files existed but were never executed by CI --
    # which is the mechanism by which a real taxonomy drift reached the default branch
    # undetected. All four are wired below; a catalogue with a validator that CI does not
    # run is not a gate.
    name: Contracts validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate protocol catalogue
        run: node contracts/validate-catalogue.cjs
      - name: Test protocol catalogue
        run: node --test contracts/test/catalogue.test.cjs
      - name: Validate child-profile-scope catalogue
        run: node contracts/child-profile-scope/validate-catalogue.cjs
      - name: Test child-profile-scope catalogue
        run: node --test contracts/child-profile-scope/test/catalogue.test.cjs
      - name: Validate runtime-sync catalogue
        run: node contracts/runtime-sync/validate-catalogue.cjs
      - name: Test runtime-sync catalogue
        run: node --test contracts/runtime-sync/test/catalogue.test.cjs
      - name: Validate wellbeing-control catalogue
        run: node contracts/wellbeing-control/validate-catalogue.cjs
      - name: Test wellbeing-control catalogue
        run: node --test contracts/wellbeing-control/test/catalogue.test.cjs

  repository-quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run repository checks
        shell: pwsh
        run: ./tooling/repo-checks/Invoke-RepositoryChecks.ps1
      - name: Run deterministic quality checks
        shell: pwsh
        run: ./tooling/quality/Invoke-QualityChecks.ps1
      - name: Test quality tooling controls
        shell: pwsh
        run: ./tooling/quality/Invoke-QualityToolingTests.ps1

  android:
    name: Android build, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Confirm clean JDK environment
        run: java --version
      - name: Assert Gradle wrapper is executable
        working-directory: android
        run: test -x ./gradlew
      - name: Build, lint, and test
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace lint test assembleDebug

  ios:
    name: iOS build and unit tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect Xcode project and PCA scheme
        working-directory: ios
        run: |
          xcodebuild -list -project PCA.xcodeproj
          xcodebuild -showBuildSettings -project PCA.xcodeproj -scheme PCA -sdk iphonesimulator
      - name: List available iOS Simulators
        run: xcrun simctl list devices available
      - name: Select an available iOS Simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone simulator was found on this macOS runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "PCA_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
      - name: Build and test the inert launch shell
        working-directory: ios
        run: |
          xcodebuild test \
            -project PCA.xcodeproj \
            -scheme PCA \
            -destination "$PCA_SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

  security:
    name: Security controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run deterministic security checks
        shell: pwsh
        run: ./tooling/security/Invoke-SecurityChecks.ps1 -EmitDependencyInventory

  dependency-audit:
    # PCA-NFR-006 (Writer65): a real dependency/supply-chain scanning gate.
    # `npm audit` is already present in the toolchain (bundled with npm
    # itself -- no new external dependency added) and reads only the
    # committed package-lock.json against npm's public advisory database;
    # it does not modify the lockfile or install anything beyond what
    # `npm ci` already would. Fails the build on any HIGH or CRITICAL
    # advisory in ANY npm-managed workspace.
    #
    # Corrected: an earlier revision of this comment claimed backend and
    # platform-admin-web were "this repository's only two npm-managed
    # workspaces". They are not. `git ls-files '*package-lock.json'` returns
    # SIX: backend, parent-web, platform-admin-web, and parent-sdk/
    # {browser-runtime,runtime-sync,wellbeing-control}. parent-web is the
    # largest dependency tree of the six and the only one carrying a
    # production dependency on a floating range, and it was the one this
    # gate did not look at. All six are audited below.
    #
    # parent-web's exclusion from the SBOM steps further down is a SEPARATE
    # and still-valid limitation: `cyclonedx-npm` needs `npm ls
    # --package-lock-only` to succeed there and it currently does not.
    # `npm audit` does not use `npm ls`, so that limitation does not apply
    # to these steps -- verified by running `npm audit --audit-level=high`
    # in parent-web directly.
    #
    # Android/iOS dependency scanning is out of this gate's scope (no
    # equivalent lockfile-based advisory tool is already present in this
    # toolchain for Gradle/CocoaPods; adding one is a separate, larger
    # decision this lane does not make silently).
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Audit backend dependencies (fails on HIGH/CRITICAL)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit parent-web dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-web
        run: npm audit --audit-level=high
      - name: Audit platform-admin-web dependencies (fails on HIGH/CRITICAL)
        working-directory: platform-admin-web
        run: npm audit --audit-level=high
      - name: Audit parent-sdk/browser-runtime dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-sdk/browser-runtime
        run: npm audit --audit-level=high
      - name: Audit parent-sdk/runtime-sync dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-sdk/runtime-sync
        run: npm audit --audit-level=high
      - name: Audit parent-sdk/wellbeing-control dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-sdk/wellbeing-control
        run: npm audit --audit-level=high
      - name: No-ads / no-data-broker SDK inventory check (PCA-FR-123)
        run: node backend/scripts/checkNoAdTrackingSdks.mjs
      # PCA-NFR-006 (Writer73): a real SBOM (Software Bill of Materials) generation gate,
      # separate from the vulnerability-audit steps above. `@cyclonedx/cyclonedx-npm` is invoked
      # via `npx --yes` (no new dependency added to any package.json/lockfile -- resolved fresh
      # from the npm registry at CI time, identical posture to `npm audit` needing no new
      # dependency either) and reads `--package-lock-only`, so it never requires `npm ci`/
      # `node_modules` to already exist. Each workspace's SBOM is validated (not merely
      # generated): a real CycloneDX document with `bomFormat: "CycloneDX"` and at least one
      # component, so a broken/empty SBOM fails this gate rather than silently passing.
      #
      # parent-web is deliberately NOT included here: verified locally (both bare and after a
      # full `npm ci`) that `cyclonedx-npm`'s underlying `npm ls --package-lock-only` fails there
      # today with ELSPROBLEMS ("missing: @types/node@22.15.30, required by
      # browser-runtime@npm:@pca/parent-sdk-browser-runtime@0.1.0" and the same for
      # `typescript@5.8.3`/`@pca/parent-sdk-wellbeing-control`) -- a pre-existing
      # lockfile/workspace-hoisting inconsistency in that workspace's own dependency tree, not an
      # SBOM-tooling limitation (backend and platform-admin-web both generate a valid, populated
      # SBOM with the identical command). Fixing parent-web's own dependency-tree inconsistency is
      # outside this gate's scope; re-add a parent-web step here once that is resolved.
      #
      # Android (Gradle) and iOS (CocoaPods) are out of this step's scope entirely -- no
      # equivalent zero-install CycloneDX generator is already available in this toolchain for
      # either, the same boundary the dependency-audit steps above already draw for those two
      # platforms.
      - name: Generate + validate backend SBOM (CycloneDX)
        working-directory: backend
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-format json --output-file sbom.cdx.json
          node -e "
            const sbom = require('./sbom.cdx.json');
            if (sbom.bomFormat !== 'CycloneDX') throw new Error('sbom.cdx.json is not a CycloneDX document');
            if (!Array.isArray(sbom.components) || sbom.components.length === 0) throw new Error('sbom.cdx.json has no components');
            console.log(\`backend SBOM: \${sbom.components.length} components, CycloneDX \${sbom.specVersion}\`);
          "
      - name: Generate + validate platform-admin-web SBOM (CycloneDX)
        working-directory: platform-admin-web
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-format json --output-file sbom.cdx.json
          node -e "
            const sbom = require('./sbom.cdx.json');
            if (sbom.bomFormat !== 'CycloneDX') throw new Error('sbom.cdx.json is not a CycloneDX document');
            if (!Array.isArray(sbom.components) || sbom.components.length === 0) throw new Error('sbom.cdx.json has no components');
            console.log(\`platform-admin-web SBOM: \${sbom.components.length} components, CycloneDX \${sbom.specVersion}\`);
          "

  web-production-demo-mode-gate:
    # Prompt-1 audit follow-up: proves the ACTUAL resolved production build
    # artifact of parent-web and platform-admin-web never wires a demo/
    # fixture data client in as the active client -- never a mere grep of a
    # .env file. See parent-web/scripts/productionDemoModeGate.mjs and
    # platform-admin-web/scripts/productionDemoModeGate.mjs for the full
    # investigation this gate's reasoning is based on. Each script's `both`
    # mode runs the real `npm run build` pipeline (tsc --noEmit -p
    # tsconfig.json && vite build) twice against a fresh OS-temp output
    # directory -- once with the real/production toggle value forced
    # (PRODUCTION_DEMO_MODE_GATE) and once with demo mode deliberately
    # forced ON (parent-web: VITE_PCA_DEMO_MODE=true; platform-admin-web,
    # which has no real demo toggle to flip, via a temporary reachable
    # canary marker injected into and then restored from
    # src/api/platformAdminApiClient.ts) to prove the gate actually rejects
    # a demo-wired build (DEMO_MODE_NEGATIVE_CONTROL) rather than rubber-
    # stamping -- and inspects the emitted JS artifact itself, never the
    # source or an env file alone. Neither script leaves build output or
    # modified source files behind (both clean up via try/finally, and the
    # negative-control script byte-for-byte-verifies its own restoration).
    name: Web production demo-mode gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install parent-web dependencies
        working-directory: parent-web
        run: npm ci
      - name: parent-web production demo-mode gate + negative control
        working-directory: parent-web
        run: npm run gate:demo-mode:both
      - name: Install platform-admin-web dependencies
        working-directory: platform-admin-web
        run: npm ci
      - name: platform-admin-web production demo-mode gate + negative control
        working-directory: platform-admin-web
        run: npm run gate:demo-mode:both
