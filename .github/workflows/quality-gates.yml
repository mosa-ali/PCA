name: Quality gates

on:
  pull_request:
  push:
    branches:
      - pca-dev

# CI only reads the repository. It does not receive credentials, publish artifacts,
# deploy, or modify repository state.
permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    # This repository ships FOUR contract catalogues, each with its own validator and
    # its own catalogue test: the top-level protocol catalogue plus child-profile-scope,
    # runtime-sync and wellbeing-control. Until now this job ran only the top-level pair,
    # so three validators and three test files existed but were never executed by CI --
    # which is the mechanism by which a real taxonomy drift reached the default branch
    # undetected. All four are wired below; a catalogue with a validator that CI does not
    # run is not a gate.
    name: Contracts validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate protocol catalogue
        run: node contracts/validate-catalogue.cjs
      - name: Test protocol catalogue
        run: node --test contracts/test/catalogue.test.cjs
      - name: Validate child-profile-scope catalogue
        run: node contracts/child-profile-scope/validate-catalogue.cjs
      - name: Test child-profile-scope catalogue
        run: node --test contracts/child-profile-scope/test/catalogue.test.cjs
      - name: Validate runtime-sync catalogue
        run: node contracts/runtime-sync/validate-catalogue.cjs
      - name: Test runtime-sync catalogue
        run: node --test contracts/runtime-sync/test/catalogue.test.cjs
      - name: Validate wellbeing-control catalogue
        run: node contracts/wellbeing-control/validate-catalogue.cjs
      - name: Test wellbeing-control catalogue
        run: node --test contracts/wellbeing-control/test/catalogue.test.cjs

  repository-quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run repository checks
        shell: pwsh
        run: ./tooling/repo-checks/Invoke-RepositoryChecks.ps1
      # PCA-DW-W2-2A: this used to fail unconditionally against the real
      # repository (stale allowlist -- see release-control's own comment
      # above for the historic workaround that was needed because of it,
      # now resolved). Runs the real script against the real repository
      # AND a negative control (a throwaway git-index entry, always
      # cleaned up) proving a genuinely disallowed top-level path is still
      # caught -- not merely that the allowlist was loosened.
      - name: Test repository checks (negative control)
        run: node tooling/repo-checks/Test-RepositoryChecks.mjs
      - name: Run deterministic quality checks
        shell: pwsh
        run: ./tooling/quality/Invoke-QualityChecks.ps1
      - name: Test quality tooling controls
        shell: pwsh
        run: ./tooling/quality/Invoke-QualityToolingTests.ps1

  release-control:
    # DW-W1-R2 (P1-A): release-gate scoping regression + FABLE parity gates.
    # Deliberately its OWN independent job, NOT a step appended to
    # `repository-quality` above (that was DW-W1-R1's mistake): that job has
    # a pre-existing, unrelated failure in "Run repository checks" (stale
    # repository-layout expectations against legitimate current
    # .dockerignore/database/docker-compose.yml -- fixing that whole old
    # framework is out of scope here), and GitHub Actions does not run a
    # job's later steps once an earlier one fails with no `continue-on-error`
    # -- so anything appended after it in the SAME job silently shows
    # "skipped" forever, never actually gate anything. Confirmed against the
    # real run for commit 8fedd311 (job "Repository quality": step "Run
    # repository checks" = failure; both release-scope steps = skipped).
    # This job is read-only, needs no `npm ci` (both scripts are plain Node
    # with zero external dependencies), and runs independently of
    # `repository-quality` so a pre-existing, unrelated failure there can
    # never hide whether release-scope/FABLE-parity genuinely pass.
    name: Release control integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test release-gate -ReleaseTarget scoping (hard invariants + negative controls)
        # Surface the failure as GitHub error annotations (visible on the
        # public checks/PR UI and via the public annotations API even
        # without authenticated log access) in addition to the full log --
        # a genuine diagnostic improvement, not a one-off hack: a future
        # failure here should never require anything beyond what the public
        # checks UI already shows. Deliberately NOT limited to lines matching
        # "FAIL": an uncaught exception/crash produces no such line at all,
        # so on any non-zero exit this emits every FAIL line AND (if none
        # matched, i.e. likely a crash) the last 25 lines of raw output,
        # so a crash is diagnosable exactly like a graceful assertion
        # failure. Newlines/percent/CR are escaped per GitHub's workflow
        # command format so multi-line output survives as one annotation.
        run: |
          # GitHub Actions runs `run:` steps as `bash --noprofile --norc -eo
          # pipefail {0}` by default -- `-e` (errexit) is ALREADY active.
          # Confirmed the hard way (DW-W1-R2): a first attempt here added
          # `set -o pipefail` (redundant -- already on) but relied on
          # reaching `status=$?` on the line AFTER the pipeline to detect
          # failure -- under `-e`, bash aborts the WHOLE script the instant
          # the failing pipeline completes, never reaching that line, so
          # the diagnostic below never ran on either real attempt (both
          # produced only the generic "Process completed with exit code 1"
          # annotation, on a REAL node-script failure each time). Wrapping
          # the pipeline in `set +e` / `set -e` is what actually lets this
          # step inspect the real exit code before deciding whether to fail.
          set +e
          node tooling/release/Test-ReleaseGateScoping.mjs 2>&1 | tee /tmp/release-scope-test.log
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            escape() { printf '%s' "$1" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
            failLines=$(grep '^FAIL' /tmp/release-scope-test.log || true)
            if [ -n "$failLines" ]; then
              echo "$failLines" | while IFS= read -r line; do echo "::error::$(escape "$line")"; done
            else
              echo "::error::No 'FAIL:' line found -- likely an uncaught exception/crash, not a graceful assertion failure. Last 25 lines:"
              echo "::error::$(escape "$(tail -n 25 /tmp/release-scope-test.log)")"
            fi
            exit $status
          fi
      # PCA-FINAL-ASSESSMENT 2026-09-08: the derived R3 ledgers (in particular
      # R3_EXTERNAL_GATE_REGISTER.csv, which ValidateExternalGateParity.mjs and
      # therefore the release gate itself depend on) had been hand-edited with
      # rows the rebuild script could not reproduce -- a regeneration silently
      # dropped four gates and failed the parity check. The register is now
      # derived from the completion matrix's gate registry, and this step fails
      # the build if any derived ledger no longer matches a fresh regeneration.
      - name: Check derived R3 ledgers are reproducible from the completion matrix
        run: node tooling/release/RebuildR3DerivedLedgers.mjs --check
      # Same discipline for the human-readable gate table: it used to list 7 of
      # 37 gates by hand. It is now generated from external_gate_matrix.json.
      - name: Check EXTERNAL_GATE_MATRIX.md is generated from external_gate_matrix.json
        run: node tooling/release/GenerateExternalGateMatrixMd.mjs --check
      - name: Validate FABLE release-scope parity (full, non-sampled reconciliation)
        # Same `set +e`/`set -e` wrapping as the step above, and for the
        # identical reason -- GitHub's default `bash -e` would otherwise
        # abort this script the instant the pipeline fails, before this
        # diagnostic ever runs.
        run: |
          set +e
          node tooling/release/ValidateFableScopeParity.mjs 2>&1 | tee /tmp/fable-parity.log
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            escape() { printf '%s' "$1" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
            failLines=$(sed -n '/^FAIL /,$p' /tmp/fable-parity.log || true)
            if [ -n "$failLines" ]; then
              echo "$failLines" | while IFS= read -r line; do echo "::error::$(escape "$line")"; done
            else
              echo "::error::No 'FAIL ' block found -- likely an uncaught exception/crash, not a graceful validation failure. Last 25 lines:"
              echo "::error::$(escape "$(tail -n 25 /tmp/fable-parity.log)")"
            fi
            exit $status
          fi

  backend-tests:
    # PPR-2 (W6). Before this job existed, this workflow ran ZERO backend tests
    # and never compiled the backend at all: `backend/package.json`'s `build`
    # (== `tsc`) is only ever invoked by `test`/`test:db`, and CI ran neither.
    # A type error or a failing unit test could reach the default branch with a
    # fully green "Quality gates" run.
    #
    # `npm test` covers all three of those in one command: `npm run build`
    # (tsc), then the two direct-execution suites (test/schema-privacy.test.mjs,
    # test/server.test.mjs), then the full non-DB suite via
    # scripts/run-tests.mjs -- 2145 tests as of this commit.
    #
    # The MySQL-backed `test:db` suite is deliberately NOT wired here: it needs
    # a provisioned MySQL instance and credentials, and this workflow is
    # read-only and credential-free by design (see the `permissions:` block).
    # That remains a KNOWN, DOCUMENTED gap rather than a silent one -- and
    # test/meta/testSuiteRegistration.test.mjs, which does run in this job,
    # still proves that test:db's own hand-maintained file list has not drifted
    # away from the DB test files actually on disk.
    #
    # Deliberately no `continue-on-error` and no `if:`. A suite that cannot fail
    # the build is not a gate; it would turn "CI does not run the tests" into
    # the permanently worse "CI runs the tests and ignores them".
    name: Backend build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # backend/package.json declares engines.node ">=22 <23"; the Node 20
          # used by the web-facing jobs below would violate it.
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build and run the full non-DB backend suite
        working-directory: backend
        run: npm test

  parent-web-unit-tests:
    # PPR-2 (W6): parent-web's 120-file Vitest suite has never been run by CI.
    #
    # WHY SHARDED RATHER THAN ONE `npm test`
    # --------------------------------------
    # A single monolithic run of these jsdom suites is not reproducible under
    # memory pressure. Measured on the authoring host (7.5 GB RAM, 16 logical
    # CPUs, ~0.5-1.0 GB free), on IDENTICAL back-to-back invocations:
    #
    #   platform-admin-web, whole suite, default pool : 3 failed / 153, then
    #                                                   0 failed / 153
    #   parent-web, --shard=1/4 (30 files)            : 1 failed / 228, then
    #                                                   0 failed / 228
    #
    # Every one of those failures passed when the same file was re-run alone,
    # i.e. TEST_INFRASTRUCTURE_INSTABILITY, not a product defect. A gate that
    # reports a different answer each time it is asked is not a gate.
    #
    # The two knobs that made it reproducible, both applied below:
    #   * `--maxWorkers=2` bounds concurrent jsdom worker processes. This is the
    #     dominant lever: the default (cpus/2, so 8 forks on the authoring host)
    #     is what exhausts memory. GitHub's standard runners have 4 cores, so
    #     vitest would pick 2 there anyway -- pinning it makes CI behave the same
    #     on any runner size instead of silently scaling with the host.
    #   * `--shard=i/8` caps each job at 15 files, the largest size that proved
    #     REPEATABLE here. 30 files/shard did not (see the divergence above).
    #
    # Evidence for 8 shards: all 8 shards were run TWICE, and all 8 produced
    # byte-identical file counts, test counts and failures on both attempts
    # (156/72/94/52/124/78/75/97 tests; 15 files each; 120 files and 748 tests
    # total, which is the whole suite -- sharding loses nothing).
    #
    # HONEST CAVEAT: the instability above is very likely LOCAL-ONLY -- a
    # 16 GB GitHub runner with nothing else resident is unlikely to reproduce
    # it. This bounded shape is kept anyway because a configuration proven
    # repeatable on a memory-starved host is repeatable on a roomy one, and
    # because it means an actual regression is never dismissed as "probably the
    # machine". Per the owner's standing rule, a batch-only failure that
    # disappears when the same file runs alone is TEST_INFRASTRUCTURE_INSTABILITY
    # and must NEVER be "fixed" by editing production source.
    name: parent-web unit tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # One failing shard must not cancel the other seven; losing the other
      # shards' results is how a single flake gets mistaken for a broad break.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # PCA-DW-W2-2C: was '20'. parent-sdk/{browser-runtime,wellbeing-control}
          # (parent-web's own `file:` dependencies, built below) declare
          # engines.node ">=22 <23", matching backend -- one supported Node line
          # across the whole repository rather than a per-app guess.
          node-version: '22'
          cache: npm
          cache-dependency-path: parent-web/package-lock.json
      # PCA-DW-W2-2C: parent-sdk/browser-runtime and parent-sdk/wellbeing-control
      # both declare `main: dist/index.js`, but dist/ is gitignored (build
      # output, not committed) and neither package has a `prepare`/`postinstall`
      # script -- so on a clean checkout, before this step existed, `npm ci` in
      # parent-web created a working `file:` symlink to a directory whose `main`
      # entry point genuinely did not exist yet, and any import of
      # @pca/parent-sdk-browser-runtime or @pca/parent-sdk-wellbeing-control
      # failed to resolve the instant a test/build actually touched it.
      - name: Build parent-sdk (parent-web's file-protocol dependencies)
        run: |
          npm ci --prefix parent-sdk/browser-runtime
          npm run build --prefix parent-sdk/browser-runtime
          npm ci --prefix parent-sdk/wellbeing-control
          npm run build --prefix parent-sdk/wellbeing-control
      - name: Install parent-web dependencies
        working-directory: parent-web
        run: npm ci
      - name: Run unit tests (shard ${{ matrix.shard }} of 8)
        working-directory: parent-web
        run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers=2

  platform-admin-web-unit-tests:
    # PPR-2 (W6): platform-admin-web's 31-file Vitest suite, likewise never run
    # by CI. Same design and the same reasoning as parent-web-unit-tests above;
    # the suite is a quarter the size, so 4 shards give the same ~8-file bound.
    #
    # Evidence: all 4 shards run TWICE, identical both times --
    # 8/8/8/7 files and 32/35/52/34 tests, zero failures. Those sum to 31 files
    # and 153 tests, exactly matching a whole-suite run, so nothing is dropped
    # by sharding. (The unsharded run of the same 31 files reported 3 failures
    # on one attempt and 0 on the next -- that is what this shape fixes.)
    name: platform-admin-web unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # PCA-DW-W2-2C: was '20' -- aligned to the one Node line the rest of
          # this repository (backend, parent-web, parent-sdk) now runs on.
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-admin-web/package-lock.json
      - name: Install platform-admin-web dependencies
        working-directory: platform-admin-web
        run: npm ci
      - name: Run unit tests (shard ${{ matrix.shard }} of 4)
        working-directory: platform-admin-web
        run: npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=2

  web-e2e:
    # PCA-FINAL-ASSESSMENT 2026-09-08 (FABLE-A018/A035): until this job existed
    # CI ran NO real-browser test at all -- six Playwright configs and ~40
    # committed specs (RBAC route guards, session security, RTL shell,
    # offline/reconnect UX, keyboard accessibility, responsive layout) had only
    # ever run on a developer's machine, and three parent-web specs had gone
    # stale against renamed demo-mode controls without anyone noticing. This
    # job runs both consoles' Playwright suites in Chromium against a
    # production build served by `vite preview` (each playwright.config.ts
    # owns its webServer), in demo mode (the committed .env), so no backend or
    # database is needed. It includes the real-browser WCAG AA colour-contrast
    # gate (e2e/contrast.spec.ts in both apps) that jsdom axe cannot provide,
    # with a script-independent Arabic-text audit because axe-core 4.10 skips
    # Arabic-only text nodes. Deliberately no continue-on-error: a real-browser
    # regression must be able to fail the build.
    name: Web real-browser e2e (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            parent-web/package-lock.json
            platform-admin-web/package-lock.json
      - name: Build parent-sdk (parent-web's file-protocol dependencies)
        run: |
          npm ci --prefix parent-sdk/browser-runtime
          npm run build --prefix parent-sdk/browser-runtime
          npm ci --prefix parent-sdk/wellbeing-control
          npm run build --prefix parent-sdk/wellbeing-control
      - name: Install parent-web dependencies
        working-directory: parent-web
        run: npm ci
      - name: Install platform-admin-web dependencies
        working-directory: platform-admin-web
        run: npm ci
      - name: Install Chromium for Playwright (both apps pin the same @playwright/test version)
        working-directory: parent-web
        run: npx playwright install --with-deps chromium
      # The job log is not readable without authenticated access to this
      # repository, so each suite's own pass/fail summary line is re-emitted as
      # a GitHub notice annotation (visible via the public check-runs API) --
      # the same technique the Android/iOS/release-control jobs use for
      # failures. `set +e`/`set -e` bracket the pipeline for the reason
      # documented on the release-control job: GitHub's default `bash -e`
      # would abort before the summary is emitted.
      # CI run 34195289791 (2026-09-08, first execution of this job) failed with
      # every parent-web spec timing out on page.goto. Root cause, reproduced
      # locally by removing parent-web/.env: the e2e specs assume DEMO MODE
      # (fixture-backed clients, the documented dev default in .env.example,
      # and what vitest.config.ts forces for unit tests), but .env is
      # gitignored in both consoles, so a clean checkout builds with demo
      # mode OFF and no API base URL. The variables are therefore forced here
      # exactly as the web-production-demo-mode-gate job forces them for its
      # own build -- never inherited from a developer's local .env. The hard
      # `timeout` bounds a hung suite well inside the job timeout so a hang
      # fails with its output attached instead of being killed silently.
      - name: parent-web Playwright suite (incl. real-browser contrast gate)
        working-directory: parent-web
        env:
          VITE_PCA_DEMO_MODE: 'true'
          VITE_PCA_API_BASE_URL: http://localhost:4001
        run: |
          set +e
          timeout 15m npx playwright test --project=chromium --reporter=list 2>&1 | tee playwright-output.log
          status="${PIPESTATUS[0]}"
          set -e
          summary="$(grep -E '^\s*[0-9]+ (passed|failed|flaky|skipped)' playwright-output.log | tr '\n' ';' | sed 's/;$//')"
          echo "::notice title=parent-web Playwright::${summary:-no summary line found}"
          if [ "$status" -ne 0 ]; then
            grep -E '^\s+[0-9]+\) ' playwright-output.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
            escape() { printf '%s' "$1" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
            echo "::error::exit ${status} -- last 30 lines: $(escape "$(tail -n 30 playwright-output.log)")"
            exit "$status"
          fi
      # platform-admin-web has no demo toggle (its e2e specs mock the auth
      # routes with page.route) and no committed .env; nothing to force here.
      - name: platform-admin-web Playwright suite (incl. real-browser contrast gate)
        working-directory: platform-admin-web
        run: |
          set +e
          timeout 10m npx playwright test --project=chromium --reporter=list 2>&1 | tee playwright-output.log
          status="${PIPESTATUS[0]}"
          set -e
          summary="$(grep -E '^\s*[0-9]+ (passed|failed|flaky|skipped)' playwright-output.log | tr '\n' ';' | sed 's/;$//')"
          echo "::notice title=platform-admin-web Playwright::${summary:-no summary line found}"
          if [ "$status" -ne 0 ]; then
            grep -E '^\s+[0-9]+\) ' playwright-output.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
            escape() { printf '%s' "$1" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
            echo "::error::exit ${status} -- last 30 lines: $(escape "$(tail -n 30 playwright-output.log)")"
            exit "$status"
          fi

  android:
    name: Android build, lint, and unit tests
    runs-on: ubuntu-24.04
    # Raised from 15 to 25 (PPR-2/W6): this suite takes ~16 minutes locally, so
    # a 15-minute cap could abort a healthy run. A timeout-induced red is
    # indistinguishable from a real red, which corrodes trust in the gate.
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Confirm clean JDK environment
        run: java --version
      - name: Assert Gradle wrapper is executable
        working-directory: android
        run: test -x ./gradlew
      - name: Build, lint, and test
        working-directory: android
        run: |
          # PCA-DW-W3 follow-up: mirrors the same diagnostic technique added
          # to the iOS job's own build/test step -- a Gradle failure here
          # previously surfaced via the public GitHub Actions API only as
          # the generic "Process completed with exit code 1", with no
          # Kotlin compiler error, lint violation, or test-failure text
          # visible without authenticated log access. `set +e`/`set -e`
          # bracket the pipeline deliberately: GitHub Actions' default
          # `bash -e -o pipefail` would otherwise abort this whole script
          # the instant `tee`'s pipeline reports non-zero, before ever
          # reaching the diagnostic code below.
          set +e
          ./gradlew --no-daemon --stacktrace lint test assembleDebug 2>&1 | tee gradle-output.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            echo "gradlew exited with status $status -- surfacing likely error/failure lines as annotations:"

            # A FAILING UNIT TEST used to be invisible here. The grep below was
            # written for compile and lint failures, and Gradle announces a test
            # failure as "org.pca.app.SomeTest > someMethod FAILED" -- no colon,
            # so it matched "FAILURE:" no better than it matched "error:". The
            # public annotations therefore showed only the generic
            # "There were failing tests. See the report at: file:///..." plus a
            # local file:// URL that nobody outside the runner can open. That is
            # the exact failure shape this wrapper exists to make diagnosable, so
            # the JUnit XML is read FIRST and names the actual failing tests.
            found_line=0
            while IFS= read -r line; do
              echo "::error::FAILING TEST: ${line}"
              found_line=1
            done < <(grep -rh -B1 --include='TEST-*.xml' -e '<failure' -e '<error ' app/build/test-results 2>/dev/null | grep -oE '<testcase name="[^"]*" classname="[^"]*"' | head -n 40 || true)

            while IFS= read -r line; do
              echo "::error::${line}"
              found_line=1
            done < <(grep -E "^e: |error:|FAILURE:|BUILD FAILED|What went wrong|Caused by:|^\s*at .*Exception|^.* > .* FAILED$|tests? completed, .* failed" gradle-output.log | head -n 50 || true)

            if [ "$found_line" -eq 0 ]; then
              echo "::error::gradlew failed (exit $status) with no matching error/failure line found by this step's own grep -- see the last 60 lines of raw output below."
              tail -n 60 gradle-output.log
            fi
            exit "$status"
          fi

  ios:
    name: iOS build and unit tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect Xcode project and PCA scheme
        working-directory: ios
        run: |
          xcodebuild -list -project PCA.xcodeproj
          xcodebuild -showBuildSettings -project PCA.xcodeproj -scheme PCA -sdk iphonesimulator
      - name: List available iOS Simulators
        run: xcrun simctl list devices available
      - name: Select an available iOS Simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone simulator was found on this macOS runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "PCA_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
      - name: Build and test the inert launch shell
        working-directory: ios
        run: |
          # PCA-DW-W3-H: a bare `xcodebuild test` failure previously surfaced
          # via the public GitHub Actions API only as the generic
          # "Process completed with exit code N" -- no compiler error, no
          # test-failure text, nothing actionable without authenticated log
          # access (the exact same opaque-CI-failure class
          # docs/supervision/PCA_DYNAMIC_WORKFLOW_W1_CLOSURE.md's own
          # "Actual CI evidence" section already hit and fixed for a
          # different job). Capturing xcodebuild's own output and re-emitting
          # its real error/failure lines as GitHub Actions `::error::`
          # annotations makes future failures diagnosable from the public,
          # unauthenticated check-runs annotations API. `set +e`/`set -e`
          # bracket the pipeline deliberately: GitHub Actions' default
          # `bash -e -o pipefail` would otherwise abort this whole script the
          # instant `tee`'s pipeline reports non-zero, before ever reaching
          # the diagnostic code below (the exact bug the W1 closure doc's own
          # "bash -e" root-cause writeup documents for its own release-control
          # steps).
          set +e
          xcodebuild test \
            -project PCA.xcodeproj \
            -scheme PCA \
            -destination "$PCA_SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-output.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            echo "xcodebuild exited with status $status -- surfacing likely error/failure lines as annotations:"
            found_line=0
            while IFS= read -r line; do
              echo "::error::${line}"
              found_line=1
            done < <(grep -E "error:|\*\* (BUILD|TEST) FAILED \*\*|fatal error|Testing failed|Fatal error" xcodebuild-output.log || true)
            if [ "$found_line" -eq 0 ]; then
              echo "::error::xcodebuild failed (exit $status) with no matching error/failure line found by this step's own grep -- see the last 40 lines of raw output below."
              tail -n 40 xcodebuild-output.log
            fi
            exit "$status"
          fi

  security:
    name: Security controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run deterministic security checks
        shell: pwsh
        run: ./tooling/security/Invoke-SecurityChecks.ps1 -EmitDependencyInventory
      # PCA-DW-W2-2B: proves the sensitive-logging detector's comment-
      # stripping fix (a JSDoc comment ending "...not a log." followed by an
      # ordinary-English/path mention of a sensitive term is no longer a
      # false positive, including across a multi-line /* ... */ block) AND,
      # as a required negative control, that a genuine call that writes a
      # child-identifying value to the console outside any comment/string is
      # still caught -- against an isolated throwaway git repository, never
      # against this repository's own files.
      - name: Test security checks (sensitive-logging comment-awareness + negative control)
        run: node tooling/security/Test-SecurityChecks.mjs

  dependency-audit:
    # PCA-NFR-006 (Writer65): a real dependency/supply-chain scanning gate.
    # `npm audit` is already present in the toolchain (bundled with npm
    # itself -- no new external dependency added) and reads only the
    # committed package-lock.json against npm's public advisory database;
    # it does not modify the lockfile or install anything beyond what
    # `npm ci` already would. Fails the build on any HIGH or CRITICAL
    # advisory in ANY npm-managed workspace.
    #
    # Corrected: an earlier revision of this comment claimed backend and
    # platform-admin-web were "this repository's only two npm-managed
    # workspaces". They are not. `git ls-files '*package-lock.json'` returns
    # SIX: backend, parent-web, platform-admin-web, and parent-sdk/
    # {browser-runtime,runtime-sync,wellbeing-control}. parent-web is the
    # largest dependency tree of the six and the only one carrying a
    # production dependency on a floating range, and it was the one this
    # gate did not look at. All six are audited below.
    #
    # parent-web's exclusion from the SBOM steps further down is a SEPARATE
    # and still-valid limitation: `cyclonedx-npm` needs `npm ls
    # --package-lock-only` to succeed there and it currently does not.
    # `npm audit` does not use `npm ls`, so that limitation does not apply
    # to these steps -- verified by running `npm audit --audit-level=high`
    # in parent-web directly.
    #
    # Android/iOS dependency scanning is out of this gate's scope (no
    # equivalent lockfile-based advisory tool is already present in this
    # toolchain for Gradle/CocoaPods; adding one is a separate, larger
    # decision this lane does not make silently).
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # PCA-DW-W2-2C: was '20' -- aligned to the one Node line the rest of
          # this repository now runs on.
          node-version: '22'
      - name: Audit backend dependencies (fails on HIGH/CRITICAL)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit parent-web dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-web
        run: npm audit --audit-level=high
      - name: Audit platform-admin-web dependencies (fails on HIGH/CRITICAL)
        working-directory: platform-admin-web
        run: npm audit --audit-level=high
      - name: Audit parent-sdk/browser-runtime dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-sdk/browser-runtime
        run: npm audit --audit-level=high
      - name: Audit parent-sdk/runtime-sync dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-sdk/runtime-sync
        run: npm audit --audit-level=high
      - name: Audit parent-sdk/wellbeing-control dependencies (fails on HIGH/CRITICAL)
        working-directory: parent-sdk/wellbeing-control
        run: npm audit --audit-level=high
      - name: No-ads / no-data-broker SDK inventory check (PCA-FR-123)
        run: node backend/scripts/checkNoAdTrackingSdks.mjs
      # PCA-NFR-006 (Writer73): a real SBOM (Software Bill of Materials) generation gate,
      # separate from the vulnerability-audit steps above. `@cyclonedx/cyclonedx-npm` is invoked
      # via `npx --yes` (no new dependency added to any package.json/lockfile -- resolved fresh
      # from the npm registry at CI time, identical posture to `npm audit` needing no new
      # dependency either) and reads `--package-lock-only`, so it never requires `npm ci`/
      # `node_modules` to already exist. Each workspace's SBOM is validated (not merely
      # generated): a real CycloneDX document with `bomFormat: "CycloneDX"` and at least one
      # component, so a broken/empty SBOM fails this gate rather than silently passing.
      #
      # parent-web is deliberately NOT included here: verified locally (both bare and after a
      # full `npm ci`) that `cyclonedx-npm`'s underlying `npm ls --package-lock-only` fails there
      # today with ELSPROBLEMS ("missing: @types/node@22.15.30, required by
      # browser-runtime@npm:@pca/parent-sdk-browser-runtime@0.1.0" and the same for
      # `typescript@5.8.3`/`@pca/parent-sdk-wellbeing-control`) -- a pre-existing
      # lockfile/workspace-hoisting inconsistency in that workspace's own dependency tree, not an
      # SBOM-tooling limitation (backend and platform-admin-web both generate a valid, populated
      # SBOM with the identical command). Fixing parent-web's own dependency-tree inconsistency is
      # outside this gate's scope; re-add a parent-web step here once that is resolved.
      #
      # Android (Gradle) and iOS (CocoaPods) are out of this step's scope entirely -- no
      # equivalent zero-install CycloneDX generator is already available in this toolchain for
      # either, the same boundary the dependency-audit steps above already draw for those two
      # platforms.
      - name: Generate + validate backend SBOM (CycloneDX)
        working-directory: backend
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-format json --output-file sbom.cdx.json
          node -e "
            const sbom = require('./sbom.cdx.json');
            if (sbom.bomFormat !== 'CycloneDX') throw new Error('sbom.cdx.json is not a CycloneDX document');
            if (!Array.isArray(sbom.components) || sbom.components.length === 0) throw new Error('sbom.cdx.json has no components');
            console.log(\`backend SBOM: \${sbom.components.length} components, CycloneDX \${sbom.specVersion}\`);
          "
      - name: Generate + validate platform-admin-web SBOM (CycloneDX)
        working-directory: platform-admin-web
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-format json --output-file sbom.cdx.json
          node -e "
            const sbom = require('./sbom.cdx.json');
            if (sbom.bomFormat !== 'CycloneDX') throw new Error('sbom.cdx.json is not a CycloneDX document');
            if (!Array.isArray(sbom.components) || sbom.components.length === 0) throw new Error('sbom.cdx.json has no components');
            console.log(\`platform-admin-web SBOM: \${sbom.components.length} components, CycloneDX \${sbom.specVersion}\`);
          "

  web-production-demo-mode-gate:
    # Prompt-1 audit follow-up: proves the ACTUAL resolved production build
    # artifact of parent-web and platform-admin-web never wires a demo/
    # fixture data client in as the active client -- never a mere grep of a
    # .env file. See parent-web/scripts/productionDemoModeGate.mjs and
    # platform-admin-web/scripts/productionDemoModeGate.mjs for the full
    # investigation this gate's reasoning is based on. Each script's `both`
    # mode runs the real `npm run build` pipeline (tsc --noEmit -p
    # tsconfig.json && vite build) twice against a fresh OS-temp output
    # directory -- once with the real/production toggle value forced
    # (PRODUCTION_DEMO_MODE_GATE) and once with demo mode deliberately
    # forced ON (parent-web: VITE_PCA_DEMO_MODE=true; platform-admin-web,
    # which has no real demo toggle to flip, via a temporary reachable
    # canary marker injected into and then restored from
    # src/api/platformAdminApiClient.ts) to prove the gate actually rejects
    # a demo-wired build (DEMO_MODE_NEGATIVE_CONTROL) rather than rubber-
    # stamping -- and inspects the emitted JS artifact itself, never the
    # source or an env file alone. Neither script leaves build output or
    # modified source files behind (both clean up via try/finally, and the
    # negative-control script byte-for-byte-verifies its own restoration).
    name: Web production demo-mode gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # PCA-DW-W2-2C: was '20' -- aligned to the one Node line the rest of
          # this repository now runs on.
          node-version: '22'
      # PCA-DW-W2-2C: see parent-web-unit-tests' identical step for why this
      # is required -- parent-web's `file:` dependency on parent-sdk/
      # browser-runtime and parent-sdk/wellbeing-control resolves to a
      # directory whose `main: dist/index.js` does not exist until built
      # (dist/ is gitignored, and neither package has a prepare/postinstall
      # script). This job's own `vite build` (via gate:demo-mode:both) needs
      # it just as much as parent-web-unit-tests' Vitest run does.
      - name: Build parent-sdk (parent-web's file-protocol dependencies)
        run: |
          npm ci --prefix parent-sdk/browser-runtime
          npm run build --prefix parent-sdk/browser-runtime
          npm ci --prefix parent-sdk/wellbeing-control
          npm run build --prefix parent-sdk/wellbeing-control
      - name: Install parent-web dependencies
        working-directory: parent-web
        run: npm ci
      # PPR-2 (W6): both web apps define a `lint` script that CI had never run.
      # These two steps live in THIS job rather than in a job of their own
      # purely because this job is already paying for `npm ci` in both
      # workspaces -- a separate lint job would duplicate the two heaviest
      # installs in the repository for two ~30-second commands. They run
      # unconditionally (no `if:`, no matrix), so there is no path on which a
      # lint failure is skipped rather than reported.
      - name: Lint parent-web
        working-directory: parent-web
        run: npm run lint
      - name: parent-web production demo-mode gate + negative control
        working-directory: parent-web
        run: npm run gate:demo-mode:both
      - name: Install platform-admin-web dependencies
        working-directory: platform-admin-web
        run: npm ci
      - name: Lint platform-admin-web
        working-directory: platform-admin-web
        run: npm run lint
      - name: platform-admin-web production demo-mode gate + negative control
        working-directory: platform-admin-web
        run: npm run gate:demo-mode:both

  public-web-build:
    # PCA Public (Release A). The package is deliberately zero-dependency: the
    # build is prerendered static HTML produced by plain Node, so this job needs
    # no `npm ci`, no lockfile cache and no entry in the dependency-audit or
    # SBOM jobs above -- there is nothing to install or audit.
    #
    # `npm run build` runs `node --check` first. That is not ceremony: a patch
    # once wrote a literal newline into a regular expression in build.mjs, which
    # made the whole module a SyntaxError and silently disabled the content
    # parity, contrast, duplication and claim-status gates while the command
    # still appeared to succeed. The syntax check is what makes the other gates
    # trustworthy.
    #
    # The gates this job actually executes: EN/AR content parity, computed WCAG
    # contrast over every token pair, logical-property-only CSS, design-token
    # layering, claim-status labels against the claim register, forbidden public
    # claims, no external origins, internal link resolution, SVG well-formedness,
    # video-asset presence, cross-route content duplication, Home reading time,
    # and staleness of the Arabic-review and new-copy lists.
    name: public-web build and content gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build PCA Public and run every content gate
        working-directory: public-web
        run: npm run build
      - name: Release-A evidence-generator regression tests
        # `npm run build` does not exercise scripts/, so the OD-12 owner
        # sign-off generator had no coverage at all and was silently broken:
        # six reviewer-selected keys were deleted from the corpus by the
        # four-page IA rebalance, which made the generator abort with a
        # misleading drift message (so the sheet the owner signs could not be
        # produced) while a second, opposite path would have written the
        # literal string "undefined" into the sheet as remediated Arabic.
        # These tests run the real generator, assert the removal handling, and
        # keep a negative control proving genuine drift still fails the run.
        working-directory: public-web
        run: npm test
      - name: Assert the generator left no uncommitted drift
        # The generator writes a TRACKED artifact
        # (docs/public/reports/RELEASE_A_ARABIC_OWNER_SIGNOFF.csv). If the
        # committed sheet ever stops matching what the current corpus and
        # ledger produce, that divergence must fail here rather than be
        # discovered when an owner signs a stale sheet.
        run: |
          if ! git diff --exit-code -- docs/public/reports/RELEASE_A_ARABIC_OWNER_SIGNOFF.csv; then
            echo "::error::The committed OD-12 sign-off sheet does not match what arabic-owner-signoff.mjs now generates. Re-run 'node scripts/arabic-owner-signoff.mjs' in public-web/ and commit the result."
            exit 1
          fi
