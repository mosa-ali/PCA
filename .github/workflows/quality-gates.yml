name: Quality gates

on:
  pull_request:
  push:
    branches:
      - pca-dev

# CI only reads the repository. It does not receive credentials, publish artifacts,
# deploy, or modify repository state.
permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate protocol catalogue
        run: node contracts/validate-catalogue.cjs
      - name: Test protocol catalogue
        run: node --test contracts/test/catalogue.test.cjs

  repository-quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run repository checks
        shell: pwsh
        run: ./tooling/repo-checks/Invoke-RepositoryChecks.ps1
      - name: Run deterministic quality checks
        shell: pwsh
        run: ./tooling/quality/Invoke-QualityChecks.ps1
      - name: Test quality tooling controls
        shell: pwsh
        run: ./tooling/quality/Invoke-QualityToolingTests.ps1

  android:
    name: Android build, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Confirm clean JDK environment
        run: java --version
      - name: Assert Gradle wrapper is executable
        working-directory: android
        run: test -x ./gradlew
      - name: Build, lint, and test
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace lint test assembleDebug

  ios:
    name: iOS build and unit tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect Xcode project and PCA scheme
        working-directory: ios
        run: |
          xcodebuild -list -project PCA.xcodeproj
          xcodebuild -showBuildSettings -project PCA.xcodeproj -scheme PCA -sdk iphonesimulator
      - name: List available iOS Simulators
        run: xcrun simctl list devices available
      - name: Select an available iOS Simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone simulator was found on this macOS runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "PCA_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
      - name: Build and test the inert launch shell
        working-directory: ios
        run: |
          xcodebuild test \
            -project PCA.xcodeproj \
            -scheme PCA \
            -destination "$PCA_SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

  security:
    name: Security controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run deterministic security checks
        shell: pwsh
        run: ./tooling/security/Invoke-SecurityChecks.ps1 -EmitDependencyInventory

  dependency-audit:
    # PCA-NFR-006 (Writer65): a real dependency/supply-chain scanning gate.
    # `npm audit` is already present in the toolchain (bundled with npm
    # itself -- no new external dependency added) and reads only the
    # committed package-lock.json against npm's public advisory database;
    # it does not modify the lockfile or install anything beyond what
    # `npm ci` already would. Fails the build on any HIGH or CRITICAL
    # advisory in either Node workspace (backend, platform-admin-web) --
    # this repository's only two npm-managed workspaces (see
    # backend/package-lock.json / platform-admin-web/package-lock.json).
    # Android/iOS dependency scanning is out of this gate's scope (no
    # equivalent lockfile-based advisory tool is already present in this
    # toolchain for Gradle/CocoaPods; adding one is a separate, larger
    # decision this lane does not make silently).
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Audit backend dependencies (fails on HIGH/CRITICAL)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit platform-admin-web dependencies (fails on HIGH/CRITICAL)
        working-directory: platform-admin-web
        run: npm audit --audit-level=high
      - name: No-ads / no-data-broker SDK inventory check (PCA-FR-123)
        run: node backend/scripts/checkNoAdTrackingSdks.mjs
