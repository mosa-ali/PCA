org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Wave 6C CI remediation: the added first-device/trust-root Kotlin sources pushed
# the RELEASE Kotlin compile past the previous 1024m heap on the 16 GB CI runner
# (java.lang.OutOfMemoryError: GC overhead limit exceeded at compileReleaseKotlin).
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

