# PCA Parent Web — nginx configuration.
#
# Serves the built SPA. This is the Parent console surface only; it is NOT
# Platform Admin's configuration (platform-admin-web/nginx.conf) or the Public
# site's (public-web/deploy/nginx.conf).
#
# Runs unprivileged on 8080, mirroring platform-admin-web/nginx.conf: a
# non-root process cannot bind port 80.
#
# DELIBERATELY NO Content-Security-Policy HEADER HERE. Content-Security-Policy
# is already delivered correctly via a build-time <meta http-equiv> tag
# (vite/securityHeadersPlugin.ts), whose connect-src is computed from
# VITE_PCA_API_BASE_URL at build time -- this nginx layer has no way to know
# that value at container-run time without re-templating this file, and
# setting a second, DIFFERENT CSP here (e.g. a hardcoded 'self'-only policy)
# risks silently being MORE restrictive than the real configured API origin
# and breaking legitimate API calls, since a real HTTP CSP header and a meta
# CSP tag are both enforced together (the effective policy is their
# intersection). This file exists to add exactly the headers
# securityHeadersPlugin.ts's own doc comment says <meta> categorically cannot
# deliver (frame-ancestors/X-Frame-Options, X-Content-Type-Options,
# Permissions-Policy) -- nothing more.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    autoindex off;

    absolute_redirect off;
    port_in_redirect off;

    # ---------------------------------------------------------------------
    # Security headers
    #
    # `always`, so they are present on 4xx/5xx too and not just on 200s.
    #
    # CAUTION: an `add_header` anywhere inside a `location` block DISCARDS
    # every add_header inherited from this level (the exact mistake
    # platform-admin-web/nginx.conf's own header comment documents fixing).
    # No location below sets an add_header; cache policy uses `expires`,
    # which does not reset inheritance.
    # ---------------------------------------------------------------------

    # Closes the exact gap securityHeadersPlugin.ts's doc comment names:
    # "this console is framable by any site today" via <meta>'s inert
    # frame-ancestors. A real X-Frame-Options header is honoured by every
    # current browser (unlike frame-ancestors, which needs a real CSP header
    # to take effect) -- DENY, since this is an authenticated parent console
    # never meant to be embedded.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # X-XSS-Protection is deliberately absent: deprecated, ignored by every
    # current browser, and its legacy filter introduced vulnerabilities of
    # its own -- the (meta-delivered) CSP is what actually provides this.
    #
    # Strict-Transport-Security is deliberately absent HERE, matching
    # platform-admin-web/nginx.conf's own reasoning: it belongs on the TLS
    # terminator (Azure App Service for this surface), not on a container
    # that only ever sees plain HTTP behind a proxy.

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets/, so these are safe to
    # cache immutably -- a new build produces new filenames.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA history fallback -- this app's routes exist only in the browser.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    # Source maps must not be served. Vite does not emit them by default for a
    # production build; this makes that a property of the server too.
    location ~ \.map$ {
        deny all;
    }
}
